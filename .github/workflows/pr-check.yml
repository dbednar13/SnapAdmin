name: PR Checks
description: Run linting, prettier checks, and build on pull requests.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  Check-Out:
    name: Checkout & Validate Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Code Setup
        uses: ./.github/actions/code-setup

  Prettier-Check:
    name: Prettier Check
    runs-on: ubuntu-latest
    needs: Check-Out

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Code Setup
        uses: ./.github/actions/code-setup

      - name: Prettier check - backend
        working-directory: packages/backend
        run: pnpm exec prettier --check .

      - name: Prettier check - webapp
        working-directory: packages/webapp
        run: pnpm exec prettier --check .

  Spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    needs: Check-Out

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Code Setup
        uses: ./.github/actions/code-setup

      - name: CSpell check
        uses: streetsidesoftware/cspell-action@v8
        with:
          config: .cspell.json

  Lint-Check:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: Check-Out

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Code Setup
        uses: ./.github/actions/code-setup

      - name: ESLint check - backend
        working-directory: packages/backend
        run: pnpm exec eslint .

      - name: ESLint check - webapp
        working-directory: packages/webapp
        run: pnpm exec eslint .

  Build:
    name: Build
    runs-on: ubuntu-latest
    needs: Check-Out

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Code Setup
        uses: ./.github/actions/code-setup

      - name: Build packages
        run: pnpm run build

  Bump-Version:
    name: Bump Version
    runs-on: ubuntu-latest
    needs: [Prettier-Check, Spellcheck, Lint-Check, Build]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Explicitly pull the source branch of the PR
          ref: ${{ github.head_ref }}
          # Fetches all history, necessary if your scripts look at Git history
          fetch-depth: 0

      - name: Code Setup
        uses: ./.github/actions/code-setup
        with:
          skip-install: true

      - name: Bump version
        uses: ./.github/actions/version-bump
        with:
          force-patch: true
