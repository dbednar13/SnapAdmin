name: PR Checks
description: Run linting, prettier checks, and build on pull requests.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  Check-Out:
    name: Lint, Prettier and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  Prettier-Check:
    name: Prettier Check
    runs-on: ubuntu-latest
    needs: Check-Out

    steps:
      - name: Prettier check - backend
        working-directory: packages/backend
        run: pnpm exec prettier --check .

      - name: Prettier check - webapp
        working-directory: packages/webapp
        run: pnpm exec prettier --check .

  Lint-Check:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: Check-Out

    steps:
      - name: ESLint check - backend
        working-directory: packages/backend
        run: pnpm exec eslint .

      - name: ESLint check - webapp
        working-directory: packages/webapp
        run: pnpm exec eslint .

  Build:
    name: Build
    runs-on: ubuntu-latest
    needs: Check-Out

    steps:
      - name: Build packages
        run: pnpm run build
