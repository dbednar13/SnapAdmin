name: 'PNPM Version Bump'
description: 'Action to smartly bump package versions using pnpm'

inputs:
  force-patch:
    description: "Forces a patch bump.  Useful for when you're pushing changes to a PR, disables git tag"
    required: false
    default: false

runs:
  using: 'composite'
  steps:
    - name: PNPM version bump
      id: bump
      shell: bash
      run: |
        if [ "${{ inputs.force-patch }}" = true ]; then
          results=$(pnpm version patch -r) >>"$GITHUB_OUTPUT"
        else
          TITLE="${{ github.event.pull_request.title }}"
          if [[ "${TITLE,,}" == major* ]]; then
            results=$(pnpm version patch -r) >>"$GITHUB_OUTPUT"
          elif [[ "${TITLE,,}" == minor* ]]; then
            results=$(pnpm version minor -r) >>"$GITHUB_OUTPUT"
          else
            results=$(pnpm version patch -r) >>"$GITHUB_OUTPUT"
          fi
        fi

    - name: Push changes
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Change Version: ${{ steps.bump.outputs.results }}"
        git push
