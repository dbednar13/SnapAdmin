name: 'Code Setup'
description: 'Re-usable action to checkout code'

runs:
  using: 'composite'
  steps:
    - name: Enable Corepack
      run: corepack enable
      shell: bash

    - name: Setup Node.js (with pnpm cache)
      uses: actions/setup-node@v6
      with:
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
