<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definition for smooth, modern gradients -->
  <defs>
    <!-- Dark deep background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Hard drive/Backup metallic blue-to-teal -->
    <linearGradient id="backupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Fast lightning bolt gradient -->
    <linearGradient id="snapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" rx="52" fill="url(#bgGrad)" />

  <!-- MAIN GRAPHIC GROUP -->
  <g id="icon-concept" transform="translate(0, -10)">
    <!-- BACKUP DRIVE / ROTATING BACKUP LOOP (Fused together) -->
    <g id="hard-drive-loop">
      <!-- Glow/Outline backing (gives visual separation) -->
      <path d="M 150,140 
               A 100,100 0 0,1 350,140 
               L 350,260 
               A 100,100 0 0,1 150,260 
               Z" 
            fill="none" stroke="#000000" stroke-width="24" stroke-linejoin="round" opacity="0.4" />
      
      <!-- Rotating Backup arrow wrapping around the drive's visual silhouette -->
      <path d="M 140,180 
               A 110,110 0 0,1 355,145 
               L 370,110 
               L 415,165 
               L 345,190 
               L 355,165 
               A 90,90 0 0,0 160,195 
               Z" 
            fill="#38BDF8" />

      <!-- The Main Drive Body (Administrative & Storage Chassis) -->
      <rect x="160" y="150" width="180" height="180" rx="36" 
            fill="url(#backupGrad)" stroke="#0F172A" stroke-width="12" stroke-linejoin="round" />

      <!-- High-contrast central 'Disk Platter' representing the HDD -->
      <circle cx="250" cy="240" r="50" fill="#020617" stroke="#38BDF8" stroke-width="10" />
      <!-- Inner hub -->
      <circle cx="250" cy="240" r="16" fill="#FFFFFF" />

      <!-- Minimalist connection / read arm -->
      <path d="M 310,290 L 270,260" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- "SNAP" LIGHTNING BOLT (Overlaying right side to show rapid backup) -->
    <g id="fast-snap">
      <!-- Dark drop Shadow/Separation Layer -->
      <polygon points="375,120 270,240 315,245 235,350 340,230 295,220" 
               fill="#020617" stroke="#020617" stroke-width="18" stroke-linejoin="round" />
      
      <!-- Energy Bolt -->
      <polygon points="375,120 270,240 315,245 235,350 340,230 295,220" 
               fill="url(#snapGrad)" stroke="#0F172A" stroke-width="6" stroke-linejoin="round" />
    </g>
  </g>

  <!-- MODERN MINIMALIST TYPOGRAPHY -->
  <g id="branding">
    <text x="50%" y="450" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="58px" letter-spacing="-1.5px">
      <!-- Fast 'Snap' in high-energy Orange -->
      <tspan fill="#F59E0B">Snap</tspan>
      <!-- Safe enterprise 'Admin' in crisp white -->
      <tspan fill="#FFFFFF">Admin</tspan>
    </text>
  </g>
</svg>
